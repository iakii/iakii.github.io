<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      body { margin: 0; padding: 0; background: #fff;  color: #000; font-family: '宋体', '宋体-简', Avenir, Helvetica, Arial, sans-serif; font-size: 14px; }
      table { border-collapse: collapse; font-family: '宋体', '宋体-简', Avenir, Helvetica, Arial, sans-serif; width:100%}
      table thead th { font-weight: bold; -webkit-text-stroke: 0.4px; }
      th, td { padding: 0 4px; text-align: left; font-size: 15px; font-family: '宋体', '宋体-简', Avenir, Helvetica, Arial, sans-serif; }
      @page { size: A4 {{data.landscape || "portrait"}};font-family: '宋体', '宋体-简', Avenir, Helvetica, Arial, sans-serif; @bottom-center { content: "第" counter(page) "页 / 共" counter(pages) "页"; font-size: 12px; font-family: '宋体', '宋体-简', Avenir, Helvetica, Arial, sans-serif; }}
      .font-500-bold { font-weight: 500; -webkit-text-stroke: 0.2px; }
      .font-600-bold { font-weight: 600; -webkit-text-stroke: 0.3px; }
      .font-700-bold { font-weight: 700; -webkit-text-stroke: 0.4px; }
      .font-800-bold { font-weight: 800; -webkit-text-stroke: 0.5px; }
      .font-900-bold { font-weight: 900; -webkit-text-stroke: 0.6px; }
      .font-bold { font-weight: bold; -webkit-text-stroke: 0.4px; }

      td pre { white-space: pre-wrap; text-align: left; font-family: '宋体', '宋体-简', Avenir, Helvetica, Arial, sans-serif; }
      .title {font-size: 24px; font-weight: bold; -webkit-text-stroke: 0.6px; text-align: center; margin: 16px 0;}
    </style>
  </head>
  <body>
    <div class="title">2025年3季度员工表</div>
    <h2>次标题</h2>
    <table style="page-break-after: always" border="1">
      <thead>
        <tr>
          <th style="width: 32px">索引</th>
          {{each data.options.columns as col}}
          <th style="width: {{col.width}}">
             {{col.title}}
          </th>
          {{/each}}
        </tr>
      </thead>
      <tbody>
        {{each data.records as row, i}}
        <tr>
          <td style="text-align: center;">
              {{i + 1}}
          </td>
          {{each data.options.columns as col}}
          <td>
            {{if col.valueType ==='avatar'}}
            <img
              src="{{row[col.dataIndex]}}"
              style="height: 14px; border-radius: 50%"
            />
            {{else if col.valueType !=='avatar'}}
            <pre>{{row[col.field]||row[col.dataIndex]}} {{/if}}</pre>
          </td>
          {{/each}}
        </tr>
        {{/each}}
      </tbody>
    </table>
  </body>
</html>
