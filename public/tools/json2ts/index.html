<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>处理JSON字符串转TS模型</title>
    <link
      href="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs/editor/editor.main.min.css"
      rel="stylesheet"
    />

    <style>
      body,
      html {
        padding: 0;
        margin: 0;
        background-color: #f6f6f7;
        overflow: hidden;
      }
      .nav {
        /* height: 64px; */
        display: flex;
        align-items: center;
      }
      .nav .icon {
        width: 24px;
        height: 24px;
        margin: 0 16px;
        cursor: pointer;
      }

      .container {
        display: flex;
        gap: 12px;
      }

      #container2 {
        flex: 1;
        min-height: calc(100vh - 94px);
      }

      #container1 {
        min-height: calc(100vh - 94px);
      }

      .left {
        flex: 1;
        min-height: calc(100vh - 94px);
      }
      .field {
        margin: 16px;
        display: flex;
        flex-direction: column;
      }

      .field label {
        font-size: 14px;
        color: #333;
        margin-bottom: 4px;
      }
      .field input {
        padding: 8px;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-size: 16px;
        outline: none;
      }
    </style>
  </head>

  <body>
    <div class="field">
      <label>模型名称</label>
      <input />
    </div>
    <div class="container">
      <div class="left">
        <div id="container1"></div>
      </div>
      <div id="container2"></div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs/loader.min.js"></script>

    <script>
      function jsonToTs(json, interfaceName = "RootObject") {
        let result = "";

        let tsCode = `export type ${interfaceName} = {\n`;

        for (const [key, value] of Object.entries(json)) {
          const { type, model } = getType(key, value);
          tsCode += `  ${key}: ${type};\n`;
          if (!!model) result += model;
        }

        tsCode += `} \n${result}`;
        return tsCode;
      }

      function getType(key, value) {
        if (value === null) return "null";
        if (Array.isArray(value)) {
          if (value.length === 0) return "any[]";
          const { type, model } = getType(key, value[0]);
          return { type: `${type}[]`, model };
        }
        if (typeof value === "object") {
          const type = key.charAt(0).toUpperCase() + key.slice(1) + "Entity";
          return {
            type,
            model: jsonToTs(value, type),
          };
        }
        return { type: typeof value };
      }
      const jsCode = JSON.stringify(
        {
          id: 1681195183773,
          name: "导出列表",
          type: "3",
          runShow: {
            a: "b",
          },
          run: [{ b: "c" }],
        },
        null,
        2
      );

      var input = document.querySelector(".field input");

      input.value = "RootObject";

      require.config({
        paths: {
          vs: "https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs",
        },
        "vs/nls": { availableLanguages: { "*": "zh-cn" } },
      });

      require(["vs/editor/editor.main"], function () {
        const editor = monaco.editor.create(
          document.getElementById("container1"),
          {
            value: jsCode,
            language: "json",
            fontSize: 16,
            padding: { top: 24 },
            wordWrap: "on", // 启用自动换行
            wrappingIndent: "indent", // 换行后缩进（可选：'none'|'same'|'indent'|'deepIndent'）
            automaticLayout: true, // 确保窗口大小变化时换行生效
          }
        );

        const editor1 = monaco.editor.create(
          document.getElementById("container2"),
          {
            value: "",
            language: "typescript",
            padding: { top: 24 },
            fontSize: 16,
            wordWrap: "on", // 启用自动换行
            wrappingIndent: "indent", // 换行后缩进（可选：'none'|'same'|'indent'|'deepIndent'）
            automaticLayout: true, // 确保窗口大小变化时换行生效
          }
        );

        input.addEventListener("keydown", function (e) {
          if (e.key === "Enter") {
            var value = editor.getValue();
            if (!value) {
              alert("请先输入数据");
              return;
            }

            const field = input.value;
            if (!field) {
              alert("请先输入提取字段");
              return;
            }
            const data = JSON.parse(value);

            console.log(field, data);
            editor1.setValue(data[field] || "没有该字段");
          }
        });

        let activeEditor = null;

        editor.onDidFocusEditorText(() => {
          activeEditor = editor;
        });

        editor1.onDidFocusEditorText(() => {
          activeEditor = editor1;
        });

        editor1.addCommand(
          monaco.KeyMod.CtrlCmd | monaco.KeyCode.KeyS,
          function () {
            var value = editor.getValue();
            var value1 = editor1.getValue();
            if (activeEditor === editor1) {
              return;
            }

            if (!value) {
              alert("请先输入数据");
              return;
            }
            const data = JSON.parse(value);

            const field = input.value;
            if (!field) {
              alert("请先输入模型名称");
              return;
            }

            const modal = {};

            editor1.setValue(`${jsonToTs(data, field)}`);
          }
        );
      });
    </script>
  </body>
</html>
