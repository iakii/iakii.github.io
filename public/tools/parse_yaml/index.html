<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>解析YAML文件</title>
    <link
      href="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs/editor/editor.main.min.css"
      rel="stylesheet"
    />

    <script src="https://cdn.jsdelivr.net/npm/js-yaml@4/dist/js-yaml.min.js"></script>
    <style>
      body,
      html {
        padding: 0;
        margin: 0;
        background-color: #f6f6f7;
        overflow: hidden;
      }
      .nav {
        /* height: 64px; */
        display: flex;
        align-items: center;
      }
      .nav .icon {
        width: 24px;
        height: 24px;
        margin: 0 16px;
        cursor: pointer;
      }

      .container {
        display: flex;
        gap: 12px;
      }

      #container2 {
        flex: 1;
        min-height: calc(100vh - 94px);
      }

      #container1 {
        min-height: calc(100vh - 94px);
      }

      .left {
        flex: 1;
        min-height: calc(100vh - 94px);
      }
      .field {
        margin: 16px;
        display: flex;
        flex-direction: column;
      }

      .field label {
        font-size: 14px;
        color: #333;
        margin-bottom: 4px;
      }
      .field input {
        padding: 8px;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-size: 16px;
        outline: none;
      }
    </style>
  </head>

  <body>
    <div class="field">
      <label>提取字段</label>
      <input />
    </div>
    <div class="container">
      <div class="left">
        <div id="container1"></div>
      </div>
      <div id="container2"></div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs/loader.min.js"></script>

    <script>
      const jsCode = ``;

      var input = document.querySelector(".field input");

      input.value = "dependencies";

      require.config({
        paths: {
          vs: "https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs",
        },
        "vs/nls": { availableLanguages: { "*": "zh-cn" } },
      });

      require(["vs/editor/editor.main"], function () {
        const editor = monaco.editor.create(
          document.getElementById("container1"),
          {
            value: jsCode,
            language: "yaml",
            fontSize: 16,
            padding: { top: 24 },
            wordWrap: "on", // 启用自动换行
            wrappingIndent: "indent", // 换行后缩进（可选：'none'|'same'|'indent'|'deepIndent'）
            automaticLayout: true, // 确保窗口大小变化时换行生效
          }
        );

        const editor1 = monaco.editor.create(
          document.getElementById("container2"),
          {
            value: "",
            language: "dart",
            padding: { top: 24 },
            fontSize: 16,
            wordWrap: "on", // 启用自动换行
            wrappingIndent: "indent", // 换行后缩进（可选：'none'|'same'|'indent'|'deepIndent'）
            automaticLayout: true, // 确保窗口大小变化时换行生效
          }
        );

        input.addEventListener("keydown", function (e) {
          if (e.key === "Enter") {
            save();
          }
        });

        let activeEditor = null;

        editor.onDidFocusEditorText(() => {
          activeEditor = editor;
        });

        editor1.onDidFocusEditorText(() => {
          activeEditor = editor1;
        });

        editor1.addCommand(
          monaco.KeyMod.CtrlCmd | monaco.KeyCode.KeyS,
          function () {
            save();
          }
        );

        function save() {

          if (activeEditor === editor1) {
            return;
          }

          var value = editor.getValue();
          var value1 = editor1.getValue();

          if (!value) {
            alert("请先输入数据");
            return;
          }


          const result = jsyaml.load(value);

          if (!result) {
            alert("解析失败");
            return;
          }

          const data = result;
          const field = input.value;
          if (!field) {
            alert("请先输入提取字段");
            return;
          }

          if (value1 === data[field]) {
            alert("数据没有变化");
            return;
          }
          console.log(field, data[field]);
          const keys = Object.keys(data[field]).join(" ");
          editor1.setValue(
            `dart pub add ${keys}\n\nflutter pub get\n\nflutter pub outdated\n\nflutter pub upgrade ${keys}`
          );
        }
      });
    </script>
  </body>
</html>
