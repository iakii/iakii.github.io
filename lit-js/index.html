<!doctype html>
<html lang="en">
  <head>
    <title>Lit.js 示例</title>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <!-- <script src="https://unpkg.com/@webcomponents/webcomponentsjs@^2/"></script> -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css"
      rel="stylesheet"
      crossorigin="anonymous"
    />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css"
    />

    <style>
      :root {
        background-color: #f6f6f7;
      }

      html,
      body {
        padding: 0;
        margin: 0;
        font-size: 16px;
      }
    </style>
    <!-- <script type="module" src="/js-library/lit-all.min.js"></script> -->
  </head>
  <body>
    <app-root></app-root>
    <script
      async
      src="https://cdn.jsdelivr.net/npm/es-module-shims@1/dist/es-module-shims.min.js"
      crossorigin="anonymous"
    ></script>
    <script type="importmap">
      {
        "imports": {
          "@popperjs/core": "https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js",
          "bootstrap": "https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.esm.min.js"
        }
      }
    </script>
    <script type="module" entry src="/lit-js/entry.js"></script>
  </body>
</html>
