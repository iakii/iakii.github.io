        <h2>处理JSON字符串的JavaScript数据</h2>
    </div>
    <div class="field">
        <label>提取字段</label>
        <input />

        <div class="left">
            <div id="container1"></div>
        </div>

    <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs/loader.min.js"></script>

    <script>
        const jsCode = JSON.stringify(
            {
                id: 1681195183773,
                name: "导出列表",
                type: "3",
                runShow:
                    "$root.render(() => {\n  const { customConfig = {} } = ($root.state || {}).doc || {}\n  return !customConfig.hideExport\n})\n",
                run: 'const tableParams = $root.getValueByKeys($root, "tableParams", {})\nconst exportConfig = $root.getValueByKeys(\n    $root,\n    "state.doc.customConfig.exportConfig",\n    {}\n)\nconst rootDepartmentTree = $root.getValueByKeys(\n    $root,\n    "state.rootDepartmentTree",\n    []\n)\nconst columnsInfo = $root.getValueByKeys(\n    $root,\n    "state.doc.customConfig.columns",\n    []\n)\nconst docName = $root.getValueByKeys($root, "state.doc.docName", "")\nconst businessDeptId = $root.getValueByKeys(\n    $root,\n    "tableParams.businessDeptId",\n    ""\n)\nconst departmentObj =\n    rootDepartmentTree.find((v) => v.id === businessDeptId) || {}\n\nlet columnsArr = []\nfor (let i of columnsInfo) {\n    if (i.children) {\n        columnsArr = columnsArr.concat(i.children)\n    } else {\n        columnsArr.push(i)\n    }\n}\n\nconst headers = columnsArr\n    .filter((v) => !v.hideInTable && v.valueType !== "indexBorder")\n    .map((v, k) => v.title)\n    .join(",")\nconst columns = columnsArr\n    .filter((v) => !v.hideInTable && v.valueType !== "indexBorder")\n    .map((v, k) => v.dataIndex)\n    .join(",")\nlet tableParamsInfo = Object.assign({}, tableParams)\ndelete tableParamsInfo["_timestamp"]\nconst year = tableParamsInfo["s-year"]\nconst loading = $root.$message.loading("加载中")\n$api\n    .download(\n        exportConfig.url || "/nursingquality/book/export",\n        Object.assign({}, tableParamsInfo, {\n            headers,\n            columns,\n            year,\n            filename:\n                (departmentObj.departmentName || "") +\n                (year || "") +\n                docName,\n        }),\n        {},\n        "get"\n    )\n    .finally(() => {\n        loading()\n    })',
            },
            null,
            2
        );

        var input = document.querySelector(".field input");

        input.value = "run";

        require.config({
            paths: {
                vs: "https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs",
            },
            "vs/nls": { availableLanguages: { "*": "zh-cn" } },
        });

        require(["vs/editor/editor.main"], function () {
            const editor = monaco.editor.create(
                document.getElementById("container1"),
                {
                    value: jsCode,
                    language: "json",
                    fontSize: 16,
                    padding: { top: 24 },
                    wordWrap: "on", // 启用自动换行
                    wrappingIndent: "indent", // 换行后缩进（可选：'none'|'same'|'indent'|'deepIndent'）
                    automaticLayout: true, // 确保窗口大小变化时换行生效
                }
            );

            const editor1 = monaco.editor.create(
                document.getElementById("container2"),
                {
                    value: "",
                    language: "javascript",
                    padding: { top: 24 },
                    fontSize: 16,
                    wordWrap: "on", // 启用自动换行
                    wrappingIndent: "indent", // 换行后缩进（可选：'none'|'same'|'indent'|'deepIndent'）
                    automaticLayout: true, // 确保窗口大小变化时换行生效
                }
            );

            input.addEventListener("keydown", function (e) {
                if (e.key === "Enter") {
                    var value = editor.getValue();
                    if (!value) {
                        alert("请先输入数据");
                        return;
                    }

                    const data = JSON.parse(value);
                    console.log(data);
                }
            });

            let activeEditor = null;

            editor.onDidFocusEditorText(() => {
                activeEditor = editor;
            });

            editor1.onDidFocusEditorText(() => {
                activeEditor = editor1;
            });

            editor1.addCommand(
                monaco.KeyMod.CtrlCmd | monaco.KeyCode.KeyS,
                function () {
                    var value = editor.getValue();
                    var value1 = editor1.getValue();

                    if (activeEditor === editor1) {
                        if (!value1) {
                            alert("请先输入数据");
                            return;
                        }

                        const data = JSON.parse(value);
                        const field = input.value;
                        if (value1 === data[field]) {
                            alert("数据没有变化");
                            return;
                        }

                        data[field] = value1;
                        editor.setValue(JSON.stringify(data, null, 2));
                        return;
                    }

                    if (!value) {
                        alert("请先输入数据");
                        return;
                    }
                    const data = JSON.parse(value);

                    const field = input.value;
                    if (!field) {
                        alert("请先输入提取字段");
                        return;
                    }

                    if (value1 === data[field]) {
                        alert("数据没有变化");
                        return;
                    }
                    console.log(field, data);
                    editor1.setValue(data[field] || "没有该字段");
                }
            );
        });
    </script>
