<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>React Schema Render</title>
    <script crossorigin src="./react.production.min.js"></script>
    <script crossorigin src="./react-dom.production.min.js"></script>
    <script src="./babel.min.js"></script>
    <script src="./react-schema-render.js"></script>
  </head>
  <body>
    <div id="example">loading...</div>
    <script type="text/babel">
      // 简单的 React 组件
      function App() {
        return <h1>Hello, React!</h1>;
      }

      console.log(1111, window);

      const root = ReactDOM.createRoot(document.getElementById("example"));
      // 渲染 React 组件到 DOM
      root.render(<App />);
    </script>
  </body>
</html>
